<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Warframe Equipment Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="drag-handle">
      <span class="title">⚔️ Equipment Overlay</span>
      <div class="header-actions">
        <span id="click-through-badge" class="badge hidden">click-through ON</span>
        <button id="close-btn" title="Fermer (Ctrl+Shift+O)">✕</button>
      </div>
    </header>

    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Cherche une arme, warframe, mod..." autofocus />
    </div>

    <div id="tabs">
      <button class="tab-btn active" data-type="all">Tout</button>
      <button class="tab-btn" data-type="warframes">Warframes</button>
      <button class="tab-btn" data-type="weapons">Armes</button>
      <button class="tab-btn" data-type="mods">Mods</button>
      <button class="tab-btn" data-type="favorites">★ Favoris</button>
    </div>

    <div id="results-list"></div>

    <div id="detail-panel" class="hidden">
      <button id="back-btn">← Retour</button>
      <div id="detail-content"></div>
    </div>

    <footer>
      <span>Ctrl+Shift+O : afficher/masquer • Ctrl+Shift+L : click-through</span>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
